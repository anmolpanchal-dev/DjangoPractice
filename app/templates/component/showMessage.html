{% for message in messages %}
    <div class="toast-message 
        {% if message.tags == 'error' %}
            toast-error
        {% else %}
            toast-success
        {% endif %}">
        
        <div class="toast-icon">
            {% if message.tags == 'error' %}
                ✕
            {% else %}
                ✓
            {% endif %}
        </div>

        <div class="toast-content">
            <strong>
                {% if message.tags == 'error' %}
                    Error
                {% else %}
                    Success
                {% endif %}
            </strong>

            <p>{{ message }}</p>
        </div>

        <button type="button" class="toast-close"
                onclick="this.parentElement.remove()">
            &times;
        </button>
    </div>
{% endfor %}

<style>
    .toast-message {
        position: fixed;
        top: 25px;
        right: 25px;
        min-width: 320px;
        max-width: 400px;

        display: flex;
        align-items: center;
        gap: 12px;

        padding: 15px 18px;
        border-radius: 12px;

        background: white;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);

        z-index: 9999;

        animation: slideIn 0.4s ease-out;
    }

    .toast-success {
        border-left: 5px solid #198754;
    }

    .toast-error {
        border-left: 5px solid #dc3545;
    }

    .toast-icon {
        width: 32px;
        height: 32px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;
        font-weight: bold;
        font-size: 17px;
    }

    .toast-success .toast-icon {
        background: #d1e7dd;
        color: #198754;
    }

    .toast-error .toast-icon {
        background: #f8d7da;
        color: #dc3545;
    }

    .toast-content {
        flex: 1;
    }

    .toast-content strong {
        display: block;
        font-size: 15px;
        margin-bottom: 3px;
    }

    .toast-content p {
        margin: 0;
        font-size: 14px;
        color: #666;
    }

    .toast-close {
        border: none;
        background: transparent;
        font-size: 22px;
        color: #777;
        cursor: pointer;
    }

    .toast-close:hover {
        color: #000;
    }

    @keyframes slideIn {
        from {
            transform: translateX(120%);
            opacity: 0;
        }

        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
</style>

<script>
    setTimeout(() => {
        document.querySelectorAll('.toast-message').forEach(toast => {
            toast.style.transition = "0.4s ease";
            toast.style.transform = "translateX(120%)";
            toast.style.opacity = "0";

            setTimeout(() => {
                toast.remove();
            }, 400);
        });
    }, 3000);
</script>
