{% extends 'base.html' %}

{% block title %}
Edit Note
{% endblock %}

{% block content %}

<div class="container">

    <form class="container mx-auto card p-3" action="{% url 'updateViewPage' id=note.id %}" method="post">

        {% csrf_token %}

        {% include 'component/showMessage.html' %}

        <div class="mb-3">
            <label for="title" class="form-label">Note Title</label>
            <input 
                type="text" 
                id="title" 
                name="title"
                class="form-control" 
                placeholder="Enter Note Title"
                value="{{note.title}}"
                >
            </div>
            
            <div class="mb-3">
                <label for="desc" class="form-label">Note Description</label>
                <textarea 
                rows="5" 
                id="desc" 
                name="description"
                class="form-control" 
                placeholder="Enter Note Description" 
                >{{note.description}}</textarea>
                
        </div>
        <div class="mb-3">
            <input type="checkbox" name="published" 
            {% if note.isPublish %}
            checked
            {% endif %}
            id="published">
            <label for="published">Status</label>
        </div>

        <div class="mb-3">
            <button type="submit" style="width:100%" class="btn btn-primary">
                Update Note
                <i class="fa-solid fa-arrow-right-long"></i>
            </button>
        </div>

    </form>

</div>
{% endblock %}
